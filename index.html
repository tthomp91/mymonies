<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Monie$</title>
<style>
:root{
  --blue:#1f6fd6; --blue-dark:#0f4c9c; --bg:#eef1f5; --card:#ffffff; --line:#e4e8ee;
  --text:#1c2733; --sub:#5c6b7a; --green:#1f9d55;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.wrap{max-width:1380px;margin:0 auto;padding:18px 16px 60px;}
.brand{font-size:34px;font-weight:800;color:var(--blue-dark);letter-spacing:.01em;margin-bottom:16px;text-align:center;}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.month{font-size:26px;font-weight:800;}
.navbtns{display:flex;gap:8px;align-items:center;}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid #cfd8e3;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--blue-dark);}
.iconbtn:hover{background:#f2f6fb;}
.todaybtn{border:1px solid #cfd8e3;background:#fff;border-radius:8px;padding:7px 14px;font-weight:600;color:var(--blue-dark);cursor:pointer;}
.banner{background:var(--card);border-radius:10px;padding:14px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,30,50,.05);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 22px;}
.banner .stat{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap;}
.banner .stat b{color:var(--text);font-size:15px;margin-left:5px;}
.banner .sep{width:1px;height:18px;background:var(--line);}
.banner .msg{font-weight:700;font-size:15px;}
.banner .msg.zero{color:var(--green);}
.banner .msg.over{color:#c0392b;}
@media (max-width:520px){.banner .sep{display:none;}}
.grid{display:grid;grid-template-columns:1fr 460px;gap:16px;align-items:start;}
.grid>div:last-child{position:sticky;top:16px;}
@media (max-width:760px){.grid{grid-template-columns:1fr;}.grid>div:last-child{position:static;}}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(20,30,50,.06);margin-bottom:16px;overflow:hidden;}
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.grouphead .gname{font-weight:800;font-size:16px;}
.uncatbadge{border:1px solid #d3dce6;background:#f4f6f9;color:var(--sub);font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;}
.uncatbadge:hover{background:#eaeff5;}
.uncatbadge.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.gheader{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--sub);padding:6px 16px 2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.gtotals{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:0 16px 6px;font-weight:700;}
.gt-fill{flex:1;}
.gt-val{width:96px;flex-shrink:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.gt-spacer{visibility:hidden;}
.items{border-top:1px solid var(--line);}
.item{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);gap:8px;background:var(--card);cursor:default;}
.item[data-type="expense"]{cursor:pointer;}
.item[data-type="expense"]:hover{background:#f6f9fd;}
.item.selected{background:#e8f0fd;}
.item.selected:hover{background:#e8f0fd;}
.item:last-child{border-bottom:none;}
.item.dragging{opacity:.4;}
.item.dragover{border-top:2px solid var(--blue);}
.handle{cursor:grab;color:#c3ccd6;font-size:14px;letter-spacing:-2px;padding:0 2px;user-select:none;}
.handle:active{cursor:grabbing;}
.iname{flex:1;background:transparent;border:none;font-size:14px;color:var(--text);font-weight:500;}
.iname:focus{outline:1px solid var(--blue);border-radius:4px;}
.iplanned,.iremain,.ispent{width:96px;flex-shrink:0;text-align:right;border:none;background:transparent;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.ispent{color:var(--sub);pointer-events:none;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.iplanned{color:var(--blue);}
.iremain{color:var(--text);pointer-events:none;}
.iremain.neg{color:#c0392b;}
.delx{background:none;border:none;color:#b6c0cc;cursor:pointer;font-size:15px;padding:2px 4px;}
.delx:hover{color:#c0392b;}
.addlink{display:block;padding:10px 16px;color:var(--blue);font-weight:700;font-size:14px;background:none;border:none;text-align:left;cursor:pointer;width:100%;}
.addlink:hover{background:#f4f8fd;}
.tabs{display:flex;background:var(--card);border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.06);}
.tab{flex:1;text-align:center;padding:13px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;}
.tab.active{color:var(--blue-dark);border-bottom-color:var(--blue-dark);background:#fff;}
.panel{background:var(--card);border-radius:0 0 10px 10px;padding:18px;box-shadow:0 1px 2px rgba(20,30,50,.06);}
.donutwrap{display:flex;justify-content:center;padding:8px 0 18px;}
.donut{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.donut .hole{width:120px;height:120px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hole .lbl{font-size:11px;letter-spacing:.03em;color:var(--sub);font-weight:700;}
.hole .amt{font-size:19px;font-weight:800;}
.metrictabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px;}
.mtab{flex:1;text-align:center;padding:8px;font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;}
.mtab.active{color:var(--text);border-bottom-color:var(--blue-dark);}
.legend{list-style:none;margin:0;padding:0;}
.legend li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.legend li:last-child{border-bottom:none;}
.legend .lname{font-weight:700;flex:1;}
.legend .lamt{font-weight:700;}
.legend .lpct{color:var(--sub);width:44px;text-align:right;}
.sumtotals{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:6px;font-size:13px;font-weight:800;}
.txtools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e8f0fd;border:1px solid #cfe0f7;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--blue-dark);}
.filterbar b{font-weight:800;}
.filterbar .clearfilter{background:none;border:none;color:var(--blue-dark);font-weight:700;cursor:pointer;font-size:12.5px;white-space:nowrap;}
.filterbar .clearfilter:hover{text-decoration:underline;}
.txtools button{font-size:12.5px;font-weight:700;border:1px solid #cfd8e3;background:#fff;color:var(--blue-dark);padding:8px 12px;border-radius:8px;cursor:pointer;}
.txtools button:hover{background:#f2f6fb;}
.txtools .synclabel{font-weight:400;color:var(--sub);}
.txform{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.txform input,.txform select{padding:8px;border:1px solid #d3dce6;border-radius:6px;font-size:13px;}
.txform input[type=text]{flex:1;min-width:100px;}
.txform input[type=date]{width:135px;}
.txform input[type=number]{width:90px;}
.txform select{flex:1;min-width:120px;}
.txform button{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;}
.txlist{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto;}
.txlist li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.txlist .tdate{color:var(--sub);width:60px;flex-shrink:0;}
.txlist .tname{flex:1;font-weight:600;min-width:0;}
.txlist .tname div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.txlist .tcat{font-size:12px;border:1px solid #d3dce6;border-radius:5px;padding:2px 4px;color:var(--sub);max-width:110px;}
.txlist .tamt{font-weight:700;width:74px;text-align:right;flex-shrink:0;}
.txlist .tamt.pos{color:var(--green);}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:13px;}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1c2733;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">My Monie$</div>
  <div class="topbar">
    <div class="month" id="monthLabel"></div>
    <div class="navbtns">
      <button class="todaybtn" id="todayBtn">Today</button>
      <button class="iconbtn" id="prevBtn">&#8249;</button>
      <button class="iconbtn" id="nextBtn">&#8250;</button>
    </div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="grid">
    <div id="leftCol"></div>
    <div>
      <div class="tabs">
        <div class="tab active" data-tab="summary">Summary</div>
        <div class="tab" data-tab="transactions">Transactions</div>
      </div>
      <div class="panel" id="rightPanel"></div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".csv" multiple style="display:none;">
<div id="toast"></div>
<script>
/* ===================== Categories & rules (ported) ===================== */
const DEFAULT_EXPENSE_CATEGORIES = [
  "Housing","Groceries","Electric","Water","Natural Gas","Internet","Mobile Phone",
  "Auto Gas","Auto Insurance","Health Insurance","Life Insurance","Car Maintenance",
  "Medical","Dining Out","Entertainment","Subscriptions","Clothing","Personal Care",
  "Pets","Childcare","Education","Travel","Gifts & Donations","Debt Payments",
  "Savings & Investments","Miscellaneous"
];
const DEFAULT_INCOME_CATEGORIES = [
  "Paycheck","Side Income","Interest","Investment Income","Gifts","Bonus","Other Income"
];
let EXPENSE_CATEGORIES = JSON.parse(localStorage.getItem('ledger_expense_categories') || 'null') || [...DEFAULT_EXPENSE_CATEGORIES];
let INCOME_CATEGORIES = JSON.parse(localStorage.getItem('ledger_income_categories') || 'null') || [...DEFAULT_INCOME_CATEGORIES];
let CATEGORY_LIMITS = JSON.parse(localStorage.getItem('ledger_limits') || '{}');
function saveCategories(){
  localStorage.setItem('ledger_expense_categories', JSON.stringify(EXPENSE_CATEGORIES));
  localStorage.setItem('ledger_income_categories', JSON.stringify(INCOME_CATEGORIES));
  localStorage.setItem('ledger_limits', JSON.stringify(CATEGORY_LIMITS));
}
const PALETTE = [
  "#5B8C5A","#D9A441","#4A7A96","#B5533C","#8B6BAA","#4A9A8C","#1D3557","#C46A8F",
  "#C4922F","#3D8B7D","#2F6F4E","#7A7A7A","#9C9581","#6E9B3D","#A65E9E","#3E6B8A",
  "#C77B3D","#548C6B","#8A5A44","#5C7A99","#B08A3E","#7A4E6E","#4E8A7A","#9A6B4E",
  "#6B8A4E","#8A4E6B","#4E6B8A","#8A6B4E","#6B4E8A"
];
function colorForCategory(name){
  let hash = 0;
  for (let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  return PALETTE[hash % PALETTE.length];
}
const DEFAULT_RULES = {
  "Housing": ["rent","mortgage","landlord","property mgmt","hoa"],
  "Groceries": ["kroger","publix","walmart","costco","target","aldi","whole foods","trader joe","food lion","sprouts"],
  "Electric": ["electric","power company","georgia power","duke energy"],
  "Water": ["water dept","water utility","water bill","water works"],
  "Natural Gas": ["natural gas","gas company","atlanta gas","scana"],
  "Auto Gas": ["shell","chevron","exxon","bp gas","gas station","circle k","quiktrip","racetrac","speedway"],
  "Auto Insurance": ["geico","progressive","state farm","allstate","liberty mutual","auto insurance"],
  "Health Insurance": ["health insurance","bcbs","blue cross","cigna","aetna","united healthcare"],
  "Internet": ["comcast","xfinity","spectrum","internet service"],
  "Mobile Phone": ["verizon","t-mobile","at&t wireless","cellular","mobile phone"],
  "Life Insurance": ["life insurance","primerica","northwestern mutual"],
  "Medical": ["pharmacy","cvs","walgreens","doctor","dental","clinic","hospital","urgent care"],
  "Pets": ["petco","petsmart","chewy","pet supplies"],
  "Subscriptions": ["netflix","spotify","hulu","disney+","apple.com/bill","subscription","adobe","icloud","youtube premium","hbo"],
  "Car Maintenance": ["auto repair","jiffy lube","tire","oil change","mechanic","car wash"],
  "Dining Out": ["starbucks","chipotle","mcdonald","restaurant","cafe","coffee","doordash","grubhub","ubereats","uber eats","pizza","taco"],
  "Clothing": ["old navy","gap","kohls","tj maxx","nordstrom","macy"],
  "Debt Payments": ["loan payment","credit card payment","student loan","auto loan"],
  "Interest": ["interest paid","interest earned"],
  "Bonus": ["bonus"]
};
let transactions = JSON.parse(localStorage.getItem('ledger_transactions') || '[]');
let learnedRules = JSON.parse(localStorage.getItem('ledger_rules') || '{}');
function saveLedger(){
  localStorage.setItem('ledger_transactions', JSON.stringify(transactions));
  localStorage.setItem('ledger_rules', JSON.stringify(learnedRules));
  render();
}
const NOISE_WORDS = /\b(pos|purchase|debit|credit|payment|recurring|autopay|auto pay|ref|reference|check|card|xx+\d*|transaction|txn|online|web|the)\b/g;
function extractSignature(desc){
  let s = cleanDescription(desc).toLowerCase();
  s = s.replace(NOISE_WORDS, ' ');
  s = s.replace(/[^a-z\s]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  const words = s.split(' ').filter(w => w.length > 1);
  return words.slice(0, 3).join(' ');
}
const US_STATE_CODES = new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC']);
const DESC_NOISE_PATTERNS = [
  /\bDDA\b/gi, /\bPOS\b/gi, /\bPUR(CH(ASE)?)?\b/gi, /\bDEBIT\b/gi, /\bCREDIT\b/gi,
  /\bCHECKCARD\b/gi, /\bRECUR(RING)?\b/gi, /\bAUTO\s*PAY\b/gi, /\bACH\b/gi, /\bPPD\b/gi,
  /\bPMT\b/gi, /\bPAYMENT\b/gi, /\bWEB\b/gi, /\bONLINE\b/gi, /\bTRANS(ACTION)?\b/gi,
  /\bTXN\b/gi, /\bREF(ERENCE)?\b/gi, /\bSQ\s*\*/gi, /\bTST\s*\*/gi, /\bPAYPAL\s*\*/gi
];
function looksLikeCode(w){
  return /\d/.test(w) && /[a-z]/i.test(w) && /^[a-z0-9]+$/i.test(w) && w.length >= 4 && w.length <= 14
    && (w === w.toLowerCase() || w === w.toUpperCase());
}
function isNoiseToken(tok){
  if (/^X+\d{3,}$/i.test(tok)) return true;
  if (/^#\d+$/.test(tok)) return true;
  if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(tok)) return true;
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(tok)) return true;
  if (/^\d{3,}$/.test(tok)) return true;
  if (looksLikeCode(tok)) return true;
  return false;
}
function cleanDescription(desc){
  if (!desc) return desc;
  const flat = desc.replace(/\r?\n/g, ' ').trim();
  const rawTokens = flat.split(/\s+/).filter(Boolean);
  const dropIdx = new Set();
  rawTokens.forEach((tok, i) => {
    if (tok.length === 2 && US_STATE_CODES.has(tok.toUpperCase())){
      dropIdx.add(i);
      if (i > 0 && /^[A-Za-z]+$/.test(rawTokens[i-1])) dropIdx.add(i-1);
      return;
    }
    if (isNoiseToken(tok)) dropIdx.add(i);
  });
  const kept = rawTokens.filter((_, i) => !dropIdx.has(i));
  let s = kept.length ? kept.join(' ') : flat;
  s = s.replace(/^\d{4,}\s+/, '');
  DESC_NOISE_PATTERNS.forEach(re => { s = s.replace(re, ' '); });
  s = s.replace(/\*/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  let tokens = s.split(' ').filter(Boolean);
  while (tokens.length > 1 && /^[A-Z]?\d{4,}$/i.test(tokens[tokens.length-1])){ tokens.pop(); }
  if (tokens.length > 1 && US_STATE_CODES.has(tokens[tokens.length-1].toUpperCase())){
    tokens.pop();
    if (tokens.length > 1) tokens.pop();
  }
  while (tokens.length > 1 && /^\d{4,}$/.test(tokens[tokens.length-1])){ tokens.pop(); }
  const cleaned = tokens.join(' ').trim();
  return titleCaseMerchant(cleaned || s.trim() || desc.trim());
}
function capitalizeWord(w){
  if (!w) return w;
  let out = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  out = out.replace(/^(Mc)([a-z])/, (m,p1,p2) => p1 + p2.toUpperCase());
  return out;
}
function titleCaseMerchant(s){
  return s.split(' ').map(word => word.startsWith('#') ? word : word.split('-').map(capitalizeWord).join('-')).join(' ');
}
function categorize(description){
  const desc = description.toLowerCase();
  const signature = extractSignature(description);
  for (const keyword in learnedRules){
    if (keyword && (signature.includes(keyword) || desc.includes(keyword))) return learnedRules[keyword];
  }
  for (const cat in DEFAULT_RULES){
    if (DEFAULT_RULES[cat].some(kw => desc.includes(kw))) return cat;
  }
  return 'Uncategorized';
}
function txSignature(date, desc, amount){
  return `${date}|${Math.round(amount * 100)}|${(desc || '').toLowerCase().replace(/\s+/g, ' ').trim()}`;
}
/* ---------- CSV parsing (ported) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field+='"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}
function findCol(headers, patterns){
  for (let i=0;i<headers.length;i++){
    const h = headers[i].toLowerCase().trim();
    if (patterns.some(p => p.test(h))) return i;
  }
  return -1;
}
function parseAmount(str){
  if (str === undefined || str === null) return null;
  let s = String(str).trim();
  if (s === '') return null;
  let negative = false;
  if (/^\(.*\)$/.test(s)){ negative = true; s = s.slice(1,-1); }
  s = s.replace(/[$,]/g,'');
  if (s.startsWith('-')){ negative = true; s = s.slice(1); }
  else if (s.startsWith('+')){ s = s.slice(1); }
  const val = parseFloat(s);
  if (isNaN(val)) return null;
  return negative ? -val : val;
}
function normalizeDate(str){
  if (!str) return '';
  const s = str.trim();
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m1){ let [_, mo, da, yr] = m1; if (yr.length===2) yr = '20'+yr; return `${yr}-${mo.padStart(2,'0')}-${da.padStart(2,'0')}`; }
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2) return `${m2[1]}-${m2[2]}-${m2[3]}`;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return s;
}
function looksLikeDate(s){
  s = (s || '').trim(); if (!s) return false;
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) return true;
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return true;
  if (/^\d{1,2}-\d{1,2}-\d{2,4}$/.test(s)) return true;
  if (/^[A-Za-z]{3,9}\.?\s+\d{1,2},?\s+\d{4}$/.test(s)) return true;
  if (/^\d{1,2}\s+[A-Za-z]{3,9}\.?\s+\d{2,4}$/.test(s)) return true;
  return false;
}
function looksLikeAmount(s){
  s = (s || '').trim(); if (!s) return false;
  return /^\(?-?\$?[\d,]+\.\d{2}\)?$/.test(s) || /^\(?-?\$?[\d,]+\)?$/.test(s);
}
function sniffColumn(dataRows, predicate, excludeIdxs){
  const sample = dataRows.slice(0, Math.min(dataRows.length, 10));
  if (sample.length === 0) return -1;
  const colCount = sample[0].length;
  let bestIdx = -1, bestHits = 0;
  for (let c = 0; c < colCount; c++){
    if (excludeIdxs.includes(c)) continue;
    let hits = 0;
    sample.forEach(row => { if (predicate(row[c])) hits++; });
    if (hits > bestHits && hits >= Math.ceil(sample.length * 0.7)){ bestHits = hits; bestIdx = c; }
  }
  return bestIdx;
}
function handleFiles(files){
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const rows = parseCSV(e.target.result);
      if (rows.length < 2) return;
      const firstRowLooksLikeData = rows[0].some(cell => looksLikeDate(cell) || looksLikeAmount(cell));
      const headers = firstRowLooksLikeData ? [] : rows[0];
      const dataRows = firstRowLooksLikeData ? rows : rows.slice(1);
      let dateIdx = findCol(headers, [/^date$/, /trans.*date/, /post.*date/, /^posted$/, /^date posted$/, /date/]);
      let descIdx = findCol(headers, [/desc/, /narrative/, /memo/, /payee/, /merchant/, /name/]);
      let amountIdx = findCol(headers, [/^amount$/, /amt/, /^amount \(\$\)$/, /transaction amount/]);
      let debitIdx = findCol(headers, [/debit/, /withdrawal/, /money out/, /payment/]);
      let creditIdx = findCol(headers, [/credit/, /deposit/, /money in/]);
      if (dateIdx === -1) dateIdx = sniffColumn(dataRows, looksLikeDate, []);
      if (amountIdx === -1 && debitIdx === -1 && creditIdx === -1) amountIdx = sniffColumn(dataRows, looksLikeAmount, [dateIdx]);
      if (descIdx === -1){
        const used = [dateIdx, amountIdx, debitIdx, creditIdx].filter(i => i >= 0);
        let bestIdx = -1, bestLen = 0;
        const colCount = dataRows[0] ? dataRows[0].length : 0;
        for (let c=0;c<colCount;c++){
          if (used.includes(c)) continue;
          const avgLen = dataRows.slice(0,10).reduce((sum,row) => sum + (row[c]||'').length, 0);
          if (avgLen > bestLen){ bestLen = avgLen; bestIdx = c; }
        }
        descIdx = bestIdx;
      }
      if (dateIdx === -1 || (amountIdx === -1 && debitIdx === -1 && creditIdx === -1)){
        showToast(`Couldn't recognize the columns in "${file.name}"`);
        return;
      }
      const triples = [];
      for (let r=0;r<dataRows.length;r++){
        const row = dataRows[r];
        if (row.every(f => f.trim()==='')) continue;
        const dateRaw = dateIdx >= 0 ? row[dateIdx] : '';
        const desc = descIdx >= 0 ? row[descIdx] : row.filter((_,i)=>i!==dateIdx).join(' ');
        let amount = null;
        if (amountIdx >= 0){ amount = parseAmount(row[amountIdx]); }
        else if (debitIdx >= 0 || creditIdx >= 0){
          const debit = debitIdx >= 0 ? parseAmount(row[debitIdx]) : null;
          const credit = creditIdx >= 0 ? parseAmount(row[creditIdx]) : null;
          if (credit !== null && credit !== 0) amount = Math.abs(credit);
          else if (debit !== null && debit !== 0) amount = -Math.abs(debit);
          else amount = 0;
        }
        if (amount === null || !desc) continue;
        triples.push([dateRaw, desc, amount]);
      }
      ingestTransactions(triples, file.name);
    };
    reader.readAsText(file);
  });
}

const BANK_SYNC_WORKER_URL = 'https://mymonies-sync.tthomp91.workers.dev';
function getBankSyncPassword(forcePrompt){

function updateSyncBankLastLabel(){

  if (!last){ el.textContent = ''; return; }
  const mins = Math.round((Date.now() - Number(last)) / 60000);
  let label;
  if (mins < 1) label = 'just now';
  else if (mins < 60) label = mins + 'm ago';
  else if (mins < 60*24) label = Math.round(mins/60) + 'h ago';
  else label = Math.round(mins/60/24) + 'd ago';

async function syncBankTransactions(retryOnAuthFail){
  const btn = document.getElementById('syncBankBtn');
  const password = getBankSyncPassword(false);
  if (!password) return;
  if (btn){ btn.disabled = true; btn.style.opacity = '0.6'; }
  try {
    const res = await fetch(BANK_SYNC_WORKER_URL, { headers: { 'X-App-Password': password } });
    if (res.status === 401){
      localStorage.removeItem('bankSyncPassword');
      if (!retryOnAuthFail){
        showToast("That password didn't work — try again");
        const retryPw = getBankSyncPassword(true);
        if (retryPw) return syncBankTransactions(true);
      } else { showToast('Bank sync password incorrect'); }
      return;
    }
    const data = await res.json().catch(() => null);
    if (!res.ok){ showToast(data && data.error ? `Bank sync error: ${data.error}` : `Bank sync failed (server said ${res.status})`); return; }
    if (data && data.error){ showToast(`Bank sync error: ${data.error}`); return; }
    const triples = (data.transactions || []).map(t => [t.date, t.description, t.amount]);
    if (triples.length === 0){ showToast('No transactions returned from your bank'); return; }
    ingestTransactions(triples, 'Bank sync');
    localStorage.setItem('bankSyncLastTime', String(Date.now()));
    updateSyncBankLastLabel();
  } catch (err){
    showToast("Couldn't reach the bank sync service — check your connection");
  } finally {
    if (btn){ btn.disabled = false; btn.style.opacity = '1'; }
  }
}
let ignoredSignatures = new Set(JSON.parse(localStorage.getItem('ledger_ignored_sigs') || '[]'));
function saveIgnoredSignatures(){ localStorage.setItem('ledger_ignored_sigs', JSON.stringify([...ignoredSignatures])); }
function ingestTransactions(triples, fileName){
  const existingSigs = new Set(transactions.map(t => txSignature(t.date, t.description, t.amount)));
  let addedCount = 0, dupCount = 0, ignoredCount = 0;
  triples.forEach(([dateRaw, desc, amount], r) => {
    if (amount === null || amount === undefined || !desc) return;
    const normDate = normalizeDate(dateRaw);
    const cleanDesc = cleanDescription(desc);
    const sig = txSignature(normDate, cleanDesc, amount);
    if (existingSigs.has(sig)){ dupCount++; return; }
    if (ignoredSignatures.has(sig)){ ignoredCount++; return; }
    existingSigs.add(sig);
    transactions.push({ id: 'tx_' + Date.now() + '_' + r + '_' + Math.random().toString(36).slice(2,7), date: normDate, description: cleanDesc, amount, category: categorize(desc) });
    addedCount++;
  });
  saveLedger();
  if (addedCount === 0 && dupCount === 0 && ignoredCount === 0){ showToast(`Couldn't find any transactions in "${fileName}"`); return; }
  const parts = [];
  if (dupCount > 0) parts.push(`skipped ${dupCount} already in your ledger`);
  if (ignoredCount > 0) parts.push(`skipped ${ignoredCount} you'd previously removed`);
  showToast(parts.length ? `Added ${addedCount} transaction${addedCount===1?'':'s'} · ${parts.join(' · ')}` : `Added ${addedCount} transaction${addedCount===1?'':'s'}`);
}
function removeTransaction(id){
  const idx = transactions.findIndex(t => t.id === id);
  if (idx === -1) return;
  const tx = transactions[idx];
  ignoredSignatures.add(txSignature(tx.date, tx.description, tx.amount));
  saveIgnoredSignatures();
  transactions.splice(idx, 1);
  saveLedger();
  showToast("Transaction removed — won't come back on future syncs");
}

let monthlyPlanned = JSON.parse(localStorage.getItem('ledger_monthly_planned') || '{}');
function saveMonthlyPlanned(){ localStorage.setItem('ledger_monthly_planned', JSON.stringify(monthlyPlanned)); }
function getPlanned(ym, cat){
  if (monthlyPlanned[ym] && monthlyPlanned[ym][cat] != null) return monthlyPlanned[ym][cat];
  const priorYms = Object.keys(monthlyPlanned).filter(k => k < ym).sort();
  for (let i = priorYms.length - 1; i >= 0; i--){
    if (monthlyPlanned[priorYms[i]][cat] != null) return monthlyPlanned[priorYms[i]][cat];
  }
  return CATEGORY_LIMITS[cat] || 0;
}
function setPlanned(ym, cat, val){
  if (!monthlyPlanned[ym]) monthlyPlanned[ym] = {};
  monthlyPlanned[ym][cat] = val;
  saveMonthlyPlanned();
}
function ymOf(date){ return (date || '').slice(0,7); }
function spentFor(ym, cat){ return transactions.filter(t => ymOf(t.date)===ym && t.category===cat && t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0); }
function receivedFor(ym, cat){ return transactions.filter(t => ymOf(t.date)===ym && t.category===cat && t.amount>0).reduce((s,t)=>s+t.amount,0); }

function removeCategory(type, name){
  const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;

function renameCategory(type, oldName, newName){
  newName = (newName||'').trim();
  if (!newName || newName===oldName){ render(); return; }
  const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  if (list.some(c=>c.toLowerCase()===newName.toLowerCase()) || newName.toLowerCase()==='uncategorized'){ showToast(`"${newName}" already exists`); render(); return; }
  const idx = list.indexOf(oldName);

  list[idx] = newName;
  transactions.forEach(tx => { if (tx.category === oldName) tx.category = newName; });
  if (CATEGORY_LIMITS[oldName] != null){ CATEGORY_LIMITS[newName] = CATEGORY_LIMITS[oldName]; delete CATEGORY_LIMITS[oldName]; }
  Object.keys(monthlyPlanned).forEach(ym => { if (monthlyPlanned[ym][oldName]!=null){ monthlyPlanned[ym][newName]=monthlyPlanned[ym][oldName]; delete monthlyPlanned[ym][oldName]; } });

  if(t.classList.contains('mtab')){activeMetric=t.dataset.metric;renderTabs();}
  if(t.dataset.addcat){
    const name=window.prompt('New '+(t.dataset.addcat==='income'?'income':'expense')+' category name:');
    if(name) addCategory(t.dataset.addcat,name);
  }
  if(t.dataset.delcat){ removeCategory(t.dataset.type,t.dataset.delcat); }
  if(t.id==='uploadCsvBtn'){ document.getElementById('fileInput').click(); }
  if(t.id==='syncBankBtn'){ syncBankTransactions(false); }
  if(t.id==='addTxBtn'){
    const date=document.getElementById('txDate').value;
    const desc=document.getElementById('txDesc').value.trim();
    const type=document.getElementById('txType').value;
    const amt=parseFloat(document.getElementById('txAmount').value);
    const cat=document.getElementById('txCat').value;
    if(!desc){showToast('Enter a description');return;}
    if(isNaN(amt)||amt<=0){showToast('Enter a valid positive amount');return;}
    transactions.push({id:'tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),date,description:desc,amount:type==='income'?Math.abs(amt):-Math.abs(amt),category:cat});
    saveLedger();
  }
  if(t.dataset.deltx){ removeTransaction(t.dataset.deltx); }
  if(t.dataset.clearfilter!==undefined){
    filterCategory=null;
    document.querySelectorAll('.item[data-type="expense"]').forEach(el=>el.classList.remove('selected'));
    document.querySelectorAll('.uncatbadge').forEach(el=>el.classList.remove('active'));
    renderTabs();
  }
  if(t.dataset.uncat!==undefined){ toggleCategoryFilter('Uncategorized'); }
  const item=t.closest('.item');
  if(item && item.dataset.type==='expense' && !t.classList.contains('iplanned') && !t.classList.contains('ispent') && !t.classList.contains('iremain') && !t.classList.contains('delx') && !t.classList.contains('handle')){
    toggleCategoryFilter(item.dataset.cat);
  }
});
document.addEventListener('focus',e=>{
  if(e.target.classList && e.target.classList.contains('iplanned')) e.target.select();
},true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.name){ renameCategory(t.dataset.type,t.dataset.name,t.value); }
  if(t.dataset.planned){ setPlanned(currentMonth,t.dataset.planned,parseFloat(t.value.replace(/[^0-9.-]/g,''))||0); render(); }
  if(t.dataset.txcat){
    const tx=transactions.find(x=>x.id===t.dataset.txcat);
    if(tx){
      const sig=extractSignature(tx.description);
      if(sig) learnedRules[sig]=t.value;
      tx.category=t.value;
      transactions.forEach(other=>{ if(other!==tx && other.category==='Uncategorized' && categorize(other.description)===t.value) other.category=t.value; });
      saveLedger();
    }
  }
});
render();
</script>
</body>
</html>
